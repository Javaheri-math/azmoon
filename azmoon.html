<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>سیستم آزمون آنلاین</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            max-width: 800px;
            width: 100%;
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        
        h1 {
            text-align: center;
            color: #1e293b;
            margin-bottom: 30px;
            font-size: 28px;
        }
        
        #loginPage {
            display: block;
        }
        
        #loginPage h2 {
            text-align: center;
            color: #334155;
            margin-bottom: 25px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-group label {
            display: block;
            font-weight: 600;
            color: #334155;
            margin-bottom: 6px;
        }
        
        .form-group input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            font-size: 16px;
            transition: 0.3s;
            direction: ltr;
            text-align: left;
        }
        
        .form-group input:focus {
            border-color: #667eea;
            outline: none;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.2);
        }
        
        .btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
        }
        
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }
        
        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        
        .error-msg {
            color: #ef4444;
            text-align: center;
            margin-top: 15px;
            font-weight: 600;
        }
        
        .success-msg {
            color: #22c55e;
            text-align: center;
            margin-top: 15px;
            font-weight: 600;
        }
        
        .loading-msg {
            text-align: center;
            color: #64748b;
            margin-top: 15px;
        }
        
        #examPage {
            display: none;
        }
        
        .exam-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 20px;
            border-bottom: 2px solid #e2e8f0;
            margin-bottom: 25px;
            flex-wrap: wrap;
            gap: 10px;
        }
        
        .student-name {
            font-size: 18px;
            font-weight: 700;
            color: #1e293b;
        }
        
        .question-counter {
            background: #667eea;
            color: white;
            padding: 6px 16px;
            border-radius: 20px;
            font-weight: 600;
        }
        
        .question-box {
            background: #f8fafc;
            border-radius: 16px;
            padding: 25px;
            margin-bottom: 25px;
            border-right: 6px solid #667eea;
        }
        
        .question-text {
            font-size: 18px;
            color: #1e293b;
            margin-bottom: 15px;
            line-height: 1.6;
        }
        
        .question-image {
            max-width: 100%;
            max-height: 300px;
            border-radius: 12px;
            margin: 10px 0;
            display: block;
        }
        
        .options-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 15px;
        }
        
        .option-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            background: white;
            border-radius: 10px;
            border: 2px solid #e2e8f0;
            cursor: pointer;
            transition: 0.3s;
        }
        
        .option-item:hover {
            border-color: #667eea;
            background: #f1f5f9;
        }
        
        .option-item.selected {
            border-color: #667eea;
            background: #e0e7ff;
        }
        
        .option-item input[type="radio"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
            accent-color: #667eea;
        }
        
        .option-item label {
            cursor: pointer;
            flex: 1;
            font-size: 16px;
        }
        
        .exam-nav {
            display: flex;
            justify-content: space-between;
            gap: 15px;
            margin-top: 25px;
            flex-wrap: wrap;
        }
        
        .exam-nav .btn {
            width: auto;
            padding: 12px 30px;
            flex: 1;
            min-width: 120px;
        }
        
        .btn-secondary {
            background: #64748b;
        }
        
        .btn-secondary:hover {
            background: #475569;
            box-shadow: 0 10px 20px rgba(100, 116, 139, 0.3);
        }
        
        .btn-success {
            background: #22c55e;
        }
        
        .btn-success:hover {
            background: #16a34a;
            box-shadow: 0 10px 20px rgba(34, 197, 94, 0.3);
        }
        
        .progress-bar {
            width: 100%;
            height: 6px;
            background: #e2e8f0;
            border-radius: 3px;
            margin-top: 20px;
            overflow: hidden;
        }
        
        .progress-fill {
            height: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            transition: width 0.3s ease;
            width: 0%;
        }
        
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(8px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .modal-overlay.active {
            display: flex;
        }
        
        .modal {
            background: white;
            border-radius: 20px;
            padding: 40px;
            max-width: 450px;
            width: 100%;
            text-align: center;
            animation: modalIn 0.4s ease;
        }
        
        @keyframes modalIn {
            from {
                transform: scale(0.8) translateY(-30px);
                opacity: 0;
            }
            to {
                transform: scale(1) translateY(0);
                opacity: 1;
            }
        }
        
        .modal .emoji {
            font-size: 64px;
            margin-bottom: 10px;
        }
        
        .modal h2 {
            color: #1e293b;
            margin-bottom: 10px;
        }
        
        .modal .score {
            font-size: 48px;
            font-weight: 800;
            color: #667eea;
            margin: 15px 0;
        }
        
        .modal .details {
            color: #64748b;
            margin-bottom: 20px;
            line-height: 1.8;
        }
        
        .modal .btn {
            width: auto;
            padding: 12px 40px;
        }
        
        @media (max-width: 600px) {
            .container {
                padding: 20px;
            }
            
            .question-box {
                padding: 16px;
            }
            
            .exam-nav .btn {
                min-width: 100%;
            }
            
            .modal {
                padding: 25px;
            }
            
            .modal .score {
                font-size: 36px;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <div id="loginPage">
        <h1>📚 سیستم آزمون آنلاین</h1>
        <h2>🔐 ورود به سیستم</h2>
        
        <div class="form-group">
            <label>👤 کد کاربری</label>
            <input type="text" id="studentCode" placeholder="مثال: 12345" />
        </div>
        
        <div class="form-group">
            <label>🔑 رمز عبور</label>
            <input type="password" id="password" placeholder="رمز عبور خود را وارد کنید" />
        </div>
        
        <button class="btn" id="loginBtn">ورود به آزمون</button>
        <div id="loginMessage"></div>
    </div>
    
    <div id="examPage">
        <div class="exam-header">
            <span class="student-name" id="studentName">👤 دانش آموز</span>
            <span class="question-counter" id="questionCounter">سوال 1 از 0</span>
        </div>
        
        <div id="questionContainer"></div>
        
        <div class="exam-nav">
            <button class="btn btn-secondary" id="prevBtn">⬅️ قبلی</button>
            <button class="btn btn-secondary" id="nextBtn">بعدی ➡️</button>
            <button class="btn btn-success" id="submitBtn">📤 پایان آزمون</button>
        </div>
        
        <div class="progress-bar">
            <div class="progress-fill" id="progressFill"></div>
        </div>
    </div>
</div>

<div class="modal-overlay" id="resultModal">
    <div class="modal">
        <div class="emoji" id="resultEmoji">🎉</div>
        <h2 id="resultTitle">نتیجه آزمون</h2>
        <div class="score" id="resultScore">20</div>
        <div class="details" id="resultDetails">از 20 سوال، 18 پاسخ صحیح</div>
        <button class="btn" id="resultBtn">✅ متوجه شدم</button>
    </div>
</div>

<!-- ========================================== -->
<!-- استفاده از import استاندارد (با type="module") -->
<!-- ========================================== -->
<script type="module">
    // ============================================
    // ایمپورت مستقیم از فایل questions.js
    // ============================================
    import questionsArray from './questions.js';
    
    // ============================================
    // تنظیمات
    // ============================================
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzHdy2sjUf2QFej8pKqv01ZLEApnVfhjwpLUIEEfCmCuOOQ4wOz6UnHKRd55zjja2zA/exec';
    // 👆 لینک Web App خود را اینجا قرار دهید
    
    // ============================================
    // متغیرهای اصلی
    // ============================================
    let questions = questionsArray || [];
    let currentQuestion = 0;
    let userAnswers = [];
    let studentData = null;
    let examStarted = false;
    
    // ============================================
    // عناصر DOM
    // ============================================
    const loginPage = document.getElementById('loginPage');
    const examPage = document.getElementById('examPage');
    const studentCodeInput = document.getElementById('studentCode');
    const passwordInput = document.getElementById('password');
    const loginBtn = document.getElementById('loginBtn');
    const loginMessage = document.getElementById('loginMessage');
    const studentNameSpan = document.getElementById('studentName');
    const questionCounter = document.getElementById('questionCounter');
    const questionContainer = document.getElementById('questionContainer');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const submitBtn = document.getElementById('submitBtn');
    const progressFill = document.getElementById('progressFill');
    const resultModal = document.getElementById('resultModal');
    const resultEmoji = document.getElementById('resultEmoji');
    const resultTitle = document.getElementById('resultTitle');
    const resultScore = document.getElementById('resultScore');
    const resultDetails = document.getElementById('resultDetails');
    const resultBtn = document.getElementById('resultBtn');
    
    // ============================================
    // بررسی وجود سوالات
    // ============================================
    if (!questions || questions.length === 0) {
        document.querySelector('.container').innerHTML = `
            <h1>❌ خطا</h1>
            <p style="text-align:center;color:#ef4444;">فایل questions.js پیدا نشد یا خالی است</p>
            <p style="text-align:center;color:#64748b;">مطمئن شوید فایل در کنار این فایل قرار دارد</p>
        `;
        throw new Error('سوالات یافت نشد');
    }
    
    console.log(`✅ ${questions.length} سوال بارگذاری شد`);
    
    // ============================================
    // توابع ارتباط با Google Sheets
    // ============================================
    async function verifyStudent(code, pass) {
        try {
            const response = await fetch(`${SCRIPT_URL}?action=verify&code=${encodeURIComponent(code)}&pass=${encodeURIComponent(pass)}`);
            return await response.json();
        } catch (error) {
            return { success: false, message: '❌ خطا در ارتباط با سرور' };
        }
    }
    
    async function saveScoreToSheet(code, pass, score) {
        try {
            const response = await fetch(`${SCRIPT_URL}?action=save&code=${encodeURIComponent(code)}&pass=${encodeURIComponent(pass)}&score=${score}`);
            return await response.json();
        } catch (error) {
            return { success: false, message: '❌ خطا در ذخیره نمره' };
        }
    }
    
    // ============================================
    // توابع آزمون
    // ============================================
    function renderQuestion(index) {
        const q = questions[index];
        if (!q) return;
        
        const hasText = q.question && q.question.trim() !== '';
        const hasImage = q.image && q.image !== null && q.image !== '';
        
        let html = `
            <div class="question-box">
                ${hasText ? `<div class="question-text">${q.question}</div>` : ''}
                ${hasImage ? `<img src="${q.image}" alt="تصویر سوال" class="question-image" />` : ''}
                <div class="options-list">
        `;
        
        q.options.forEach((opt, i) => {
            const letter = String.fromCharCode(65 + i);
            const checked = userAnswers[index] === i ? 'checked' : '';
            const selected = userAnswers[index] === i ? 'selected' : '';
            html += `
                <div class="option-item ${selected}" onclick="window.selectOption(${index}, ${i})">
                    <input type="radio" name="question${index}" value="${i}" ${checked} />
                    <label>${letter}: ${opt}</label>
                </div>
            `;
        });
        
        html += `
                </div>
            </div>
        `;
        
        questionContainer.innerHTML = html;
        
        questionCounter.textContent = `سوال ${index + 1} از ${questions.length}`;
        
        const progress = ((index + 1) / questions.length) * 100;
        progressFill.style.width = `${progress}%`;
        
        prevBtn.style.display = index === 0 ? 'none' : 'block';
        nextBtn.style.display = index === questions.length - 1 ? 'none' : 'block';
        submitBtn.style.display = index === questions.length - 1 ? 'block' : 'none';
    }
    
    window.selectOption = function(qIndex, optIndex) {
        userAnswers[qIndex] = optIndex;
        
        const options = document.querySelectorAll('.option-item');
        options.forEach((item, i) => {
            const radio = item.querySelector('input[type="radio"]');
            if (i === optIndex) {
                radio.checked = true;
                item.classList.add('selected');
            } else {
                radio.checked = false;
                item.classList.remove('selected');
            }
        });
    };
    
    function goToPrev() {
        if (currentQuestion > 0) {
            currentQuestion--;
            renderQuestion(currentQuestion);
        }
    }
    
    function goToNext() {
        if (currentQuestion < questions.length - 1) {
            currentQuestion++;
            renderQuestion(currentQuestion);
        }
    }
    
    function calculateScore() {
        let correct = 0;
        questions.forEach((q, index) => {
            if (userAnswers[index] === q.correctAnswer) {
                correct++;
            }
        });
        return {
            correct: correct,
            total: questions.length,
            percentage: Math.round((correct / questions.length) * 100),
            score: correct
        };
    }
    
    async function submitExam() {
        const unanswered = userAnswers.some(a => a === undefined);
        if (unanswered) {
            if (!confirm('⚠️ به همه سوالات پاسخ نداده‌اید. آیا مطمئن هستید؟')) {
                return;
            }
        }
        
        const result = calculateScore();
        
        resultScore.textContent = `${result.correct} از ${result.total}`;
        resultDetails.textContent = `✅ ${result.correct} پاسخ صحیح از ${result.total} سوال`;
        
        if (result.percentage >= 80) {
            resultEmoji.textContent = '🎉';
            resultTitle.textContent = '🌟 عالی!';
        } else if (result.percentage >= 50) {
            resultEmoji.textContent = '😊';
            resultTitle.textContent = '👍 خوب بود!';
        } else {
            resultEmoji.textContent = '📚';
            resultTitle.textContent = '💪 بیشتر تلاش کن!';
        }
        
        resultModal.classList.add('active');
        
        try {
            const saveResult = await saveScoreToSheet(
                studentData.code,
                studentData.password,
                result.correct
            );
            console.log('نتیجه ذخیره:', saveResult);
        } catch (error) {
            console.error('خطا در ذخیره نمره:', error);
        }
    }
    
    // ============================================
    // رویدادها
    // ============================================
    
    loginBtn.addEventListener('click', async function() {
        const code = studentCodeInput.value.trim();
        const pass = passwordInput.value.trim();
        
        if (!code || !pass) {
            loginMessage.innerHTML = '<div class="error-msg">❌ لطفاً کد کاربری و رمز عبور را وارد کنید</div>';
            return;
        }
        
        loginBtn.disabled = true;
        loginBtn.textContent = '⏳ در حال بررسی...';
        loginMessage.innerHTML = '<div class="loading-msg">⏳ در حال احراز هویت...</div>';
        
        try {
            const result = await verifyStudent(code, pass);
            
            if (result.success) {
                studentData = {
                    name: result.name,
                    code: code,
                    password: pass,
                    row: result.row
                };
                
                loginMessage.innerHTML = `<div class="success-msg">✅ خوش آمدید ${result.name}</div>`;
                
                setTimeout(() => {
                    startExam();
                }, 500);
            } else {
                loginMessage.innerHTML = `<div class="error-msg">${result.message}</div>`;
            }
        } catch (error) {
            loginMessage.innerHTML = `<div class="error-msg">❌ خطا در ارتباط با سرور: ${error.message}</div>`;
        }
        
        loginBtn.disabled = false;
        loginBtn.textContent = 'ورود به آزمون';
    });
    
    function startExam() {
        loginPage.style.display = 'none';
        examPage.style.display = 'block';
        studentNameSpan.textContent = `👤 ${studentData.name}`;
        
        userAnswers = new Array(questions.length).fill(undefined);
        currentQuestion = 0;
        renderQuestion(0);
        examStarted = true;
    }
    
    prevBtn.addEventListener('click', goToPrev);
    nextBtn.addEventListener('click', goToNext);
    submitBtn.addEventListener('click', submitExam);
    
    resultBtn.addEventListener('click', function() {
        resultModal.classList.remove('active');
        location.reload();
    });
    
    // ============================================
    // کیبورد
    // ============================================
    document.addEventListener('keydown', function(e) {
        if (!examStarted) return;
        
        if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
            e.preventDefault();
            if (currentQuestion < questions.length - 1) {
                goToNext();
            }
        } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
            e.preventDefault();
            if (currentQuestion > 0) {
                goToPrev();
            }
        }
    });
    
    document.addEventListener('keydown', function(e) {
        if (e.key === 'Enter' && loginPage.style.display !== 'none') {
            loginBtn.click();
        }
    });
    
    console.log('✅ سیستم آزمون راه‌اندازی شد!');
</script>

</body>
</html>
